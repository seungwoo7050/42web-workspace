name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 타입 검사·단위 테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 버전은 package.json의 packageManager·engines와 .node-version에 맞춘다(tests/ci-contract.test.mjs가 대조한다)
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm unit
      - name: 정적 계약 검사
        run: pnpm test:contracts
      - run: pnpm build
      - name: 빌드 산출물 확인
        run: pnpm verify:build

  postgres-integration:
    name: PostgreSQL 통합 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # services를 두지 않는다 - 테스트가 testcontainers로 러너의 Docker에 PostgreSQL을 직접 띄운다
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm postgres-integration

  process-and-browser:
    name: HTTP·WebSocket 스모크와 브라우저 e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: pong_pong_test, POSTGRES_USER: pong, POSTGRES_PASSWORD: pong }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pong -d pong_pong_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://pong:pong@127.0.0.1:5432/pong_pong_test
      # e2e의 page.request가 브라우저 쿠키를 함께 쓰려면 웹의 기본 API 주소(localhost)와 호스트가 같아야 한다
      API_BASE_URL: http://localhost:4000
      WS_URL: ws://127.0.0.1:4000/ws
      APP_MODE: development
      LOG_LEVEL: warn
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: 테스트 DB 준비(마이그레이션·개발 시드)
        run: |
          pnpm --filter @pong-pong/db migrate
          pnpm --filter @pong-pong/db seed:dev
      - name: CI 전용 세션 비밀값
        # 실제 비밀이 필요 없는 경로라 실행마다 더미 값을 만든다
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: API·웹 실행
        run: |
          mkdir -p "$LOG_DIR"
          node apps/api/dist/index.js > "$LOG_DIR/api.log" 2>&1 &
          pnpm --filter @pong-pong/web start > "$LOG_DIR/web.log" 2>&1 &
          # 준비될 때까지 각각 최대 60초 기다린다(러너에 이미 있는 curl만 쓴다 - 실행 중에 패키지를 내려받지 않는다)
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:4000/health/ready > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4000/health/ready > /dev/null || { cat "$LOG_DIR/api.log"; exit 1; }
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:3000 > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000 > /dev/null || { cat "$LOG_DIR/web.log"; exit 1; }
      - run: pnpm smoke:http
      - run: pnpm smoke:ws
      - run: pnpm e2e
      - name: 실패하면 API·웹 로그와 Playwright 결과를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-and-browser-logs
          path: |
            ci-logs/
            test-results/
          retention-days: 7

  guest-demo-browser:
    name: 비회원 체험 브라우저 e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # DATABASE_URL이 없으면 API가 메모리 저장소로 돌기 때문에 services를 두지 않는다
    env:
      APP_MODE: demo
      E2E_APP_MODE: demo
      E2E_BASE_URL: http://localhost:3000
      # NEXT_PUBLIC_* 값은 next build 때 번들에 들어가므로 job 전체에 둔다
      NEXT_PUBLIC_APP_MODE: demo
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      LOG_LEVEL: warn
      LOG_DIR: ${{ github.workspace }}/ci-logs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: demo 모드로 빌드
        run: pnpm build
      - name: CI 전용 세션 비밀값
        # demo 모드는 32바이트 이상을 요구한다(apps/api/src/env.ts). 실제 비밀이 아니라 실행마다 만든다
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: demo API·웹 실행
        run: |
          mkdir -p "$LOG_DIR"
          node apps/api/dist/index.js > "$LOG_DIR/api.log" 2>&1 &
          pnpm --filter @pong-pong/web start > "$LOG_DIR/web.log" 2>&1 &
          # 준비될 때까지 각각 최대 60초 기다린다(러너에 이미 있는 curl만 쓴다 - 실행 중에 패키지를 내려받지 않는다)
          for _ in $(seq 1 60); do curl -sf http://localhost:4000/health/ready > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4000/health/ready > /dev/null || { cat "$LOG_DIR/api.log"; exit 1; }
          for _ in $(seq 1 60); do curl -sf http://localhost:3000 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000 > /dev/null || { cat "$LOG_DIR/web.log"; exit 1; }
      - name: tests/e2e/guest-demo.spec.ts 실행
        run: pnpm e2e:guest-demo
      - name: 실패하면 API·웹 로그와 Playwright 결과를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-demo-browser-logs
          path: |
            ci-logs/
            test-results/
          retention-days: 7
