name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 린트/타입/콘텐츠 검사
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # lockfile은 packageManager의 npm으로 만든 것이라 러너 기본 npm 대신 같은 버전을 쓴다
      - name: npm 버전 고정
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version
      - run: npm ci
      - name: 운영 의존성 취약점 검사
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check

  unit:
    name: 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm 버전 고정
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run test

  e2e:
    name: 프로덕션 빌드·e2e·성능 예산
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm 버전 고정
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # test:e2e:ci가 프로덕션 빌드까지 한다. 아래 검사들은 빌드를 다시 하지 않으려고 같은 job에서 그 산출물을 쓴다
      - name: 프로덕션 빌드와 e2e(@visual 제외)
        run: npm run test:e2e:ci
      - name: standalone 산출물 검사
        run: npm run build:verify
      - name: 경로별 번들 예산 검사
        run: npm run bundle:check
      # 러너에 Chrome을 따로 받지 않고 Playwright가 받은 Chromium을 Lighthouse에 넘긴다
      - name: Lighthouse용 Chromium 경로
        run: echo "CHROME_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Lighthouse 성능·접근성 예산
        run: npm run lighthouse:audit
      - name: 실패하면 Playwright·Lighthouse 결과를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7

  container:
    name: 컨테이너 이미지 검사
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 검사 스크립트는 Node 내장 모듈과 docker CLI만 쓰므로 npm ci가 필요 없다(의존성 설치는 Dockerfile 안에서 한다)
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 이미지 빌드·비root 실행·경로와 공개 자산 응답 검사
        run: npm run test:container
  
  deploy:
    name: Vercel 배포
    # 검사 job이 모두 통과해야 배포한다. 하나라도 실패하면 이 job은 건너뛴다
    needs: [check, unit, e2e, container]
    # 배포할 브랜치는 저장소 변수로 정한다(공개 템플릿 저장소는 portfolio-template, 비공개 사본은 main).
    # 같은 ci.yml을 두 저장소가 그대로 쓰므로 템플릿 갱신을 비공개 사본에 병합해도 이 파일이 충돌하지 않는다. 변수가 없으면 배포하지 않는다
    if: github.ref_name == vars.PORTFOLIO_DEPLOY_BRANCH
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 위의 ci-${{ github.ref }}는 새 push가 오면 취소한다. 배포 도중 끊기지 않게 배포만 따로 줄을 세운다
    concurrency:
      group: deploy-portfolio
      cancel-in-progress: false
    # 저장소 첫 화면의 Deployments와 실행 화면의 배포 링크를 만든다. 같은 저장소의 다른 고아 브랜치(pong-pong)와 이름을 나눈다
    environment:
      name: portfolio
      url: ${{ vars.PORTFOLIO_SITE_URL }}
    # secrets·variables는 브랜치가 아니라 저장소에 하나씩이다. 같은 저장소의 다른 고아 브랜치 프로젝트와 겹치지 않게 PORTFOLIO_를 붙인다
    # vercel CLI는 VERCEL_ORG_ID·VERCEL_PROJECT_ID 환경 변수가 있으면 .vercel/project.json 없이 그 프로젝트를 쓴다
    env:
      VERCEL_ORG_ID: ${{ secrets.PORTFOLIO_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.PORTFOLIO_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.PORTFOLIO_VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm·vercel 버전 고정
        run: npm install --global npm@11.16.0 vercel@50.4.10
      - name: Vercel 프로젝트 설정과 production 환경 변수 받기
        # 프로젝트에 넣어 둔 PORTFOLIO_CONTENT_MODE·SITE_URL이 여기서 내려와 다음 단계의 prebuild(content:ready)에 쓰인다.
        # 템플릿 데모 프로젝트는 아무것도 넣지 않아 template 모드로 빌드된다
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: 러너에서 빌드
        # Vercel 쪽 빌드를 쓰지 않고 검사를 통과한 이 커밋을 러너에서 빌드해 산출물만 올린다
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: 배포
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
